name: Deploy ke cPanel (SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Siapkan SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Simpan host key server supaya tidak ditanya konfirmasi.
          # Diambil dari secret, bukan di-scan otomatis — memindai
          # otomatis membuka celah man-in-the-middle.
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Jalankan deploy di server
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "bash ~/apps.rizkyfauzi.com/deploy.sh"

      - name: Bersihkan SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
