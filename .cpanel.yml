---
# Konfigurasi deploy cPanel (Git Version Control → Deploy HEAD Commit).
#
# Struktur repo kita:
#   public/   → isi yang harus jadi document root
#   src/      → kode internal, tidak diakses browser
#   vendor/   → dependency, sudah ikut ter-commit
#   .env      → dibuat manual, TIDAK ada di repo
#
# cPanel men-deploy dari root repo, sementara document root mengarah
# ke folder public/. Jadi isi public/ dipindahkan ke document root,
# dan src/ + vendor/ ditaruh tepat di atasnya — di situ index.php
# mencarinya (lihat pencarian $baseDir di public/index.php).

deployment:
  tasks:
    # ---------------------------------------------------------------
    # GANTI BARIS DI BAWAH INI sesuai document root kamu.
    # Cek di cPanel → Domains → Document Root.
    #
    # Contoh: /home/rizkyfau/apps.rizkyfauzi.com/public
    # ---------------------------------------------------------------
    - export DEPLOYPATH=/home/rizkyfau/apps.rizkyfauzi.com/public

    # Folder repo, tempat src/ dan vendor/ berada.
    # Satu level di atas document root.
    - export BASEPATH=/home/rizkyfau/apps.rizkyfauzi.com

    - /bin/mkdir -p $DEPLOYPATH

    # Isi public/ ke document root.
    # Titik di akhir "public/." berarti isinya, bukan foldernya.
    # Kalau pakai "public" saja, hasilnya jadi public/public/.
    - /bin/cp -R public/. $DEPLOYPATH

    # src dan vendor sudah ada di $BASEPATH karena itu folder repo itu
    # sendiri — tidak perlu disalin. Menyalinnya justru menghasilkan
    # src/src/ dan vendor/vendor/, karena cp -R menyalin foldernya.

    # .env juga tidak disentuh — dibuat manual di $BASEPATH.

    # Laporkan hasilnya supaya terlihat di log deploy.
    - echo "Deploy selesai. Document root: $DEPLOYPATH"
    - /bin/ls -la $DEPLOYPATH | head -20
